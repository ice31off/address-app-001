qbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;padding:0 10px}.qbtn-label{min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left;flex:1}.qbtn-arrow{flex-shrink:0;margin-left:auto;text-align:right;color:#c1c4ca}.qactions{margin:10px 0 19px}.navbutton{background:#25272d;height:112px;width:100%;border:0;border-radius:12px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:18px;margin-bottom:12px}.navbutton i{font-style:normal;font-size:26px;color:#c3c6ce}.panel{background:#25272d;padding:13px;border-radius:11px}.moneygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.moneygrid .input{padding:10px;font-size:14px}.subhead{font-weight:700;margin:15px 0 10px}.oprow{display:grid;grid-template-columns:1fr 100px 29px;gap:7px;margin-bottom:9px;align-items:center}.oprow .input{padding:9px;font-size:13px}.smallremove{background:#3f292d;border:0;border-radius:6px;color:#f9b4b4;height:38px}.amounttotal{display:flex;justify-content:space-between;border-top:1px solid #4c4f58;margin-top:14px;padding-top:14px;font-size:16px;font-weight:700}.filter-summary{display:flex;gap:8px;align-items:flex-start;margin:16px 0}.filter-summary>.muted{font-size:11px;white-space:nowrap;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#28364a;color:#c7dbfb;border:1px solid #52647d;border-radius:5px;font-size:11px;padding:4px 5px}.chip button{border:0;background:none;color:inherit;font-size:15px}.result-head{display:flex;align-items:center;justify-content:space-between;margin:15px 0 9px}.ellipsis{border:1px solid #4a4c55;border-radius:7px;background:#272a31;color:white;width:42px;height:30px;font-size:22px;line-height:0}.record{background:#25272d;height:51px;border-radius:8px;display:flex;overflow:hidden;margin-bottom:6px}.record-data{display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap;min-width:0;flex:1;padding:0 9px;scrollbar-width:thin;font-size:11px}.record-data span{flex-shrink:0}.kind{display:inline-flex;align-items:center;justify-content:center;background:#326bc0;border-radius:4px;height:20px;min-width:20px;padding:0 3px;font-size:11px;font-weight:700;color:white}.kind.repeat{background:#a66727}.record .ellipsis{width:36px;flex:0 0 36px;border:0;border-left:1px solid #393b43;border-radius:0;height:51px;font-size:20px}.detailbox{background:#25272d;border-radius:11px;padding:5px 12px}.detailrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:51px;border-bottom:1px solid #3c3f47;padding:15px 0;font-size:13px}.detailrow:last-child{border:0}.detailrow>span:first-child{width:72px;flex-shrink:0;color:#b1b5bf;font-size:12px}.detailrow>.value{flex:1;text-align:right;overflow-wrap:anywhere;white-space:pre-wrap}.detailrow.review{display:block}.detailrow.review>.value{display:block;text-align:left;line-height:1.75;margin-top:12px}.linkbutton{border:0;background:none;color:#e7f0ff;padding:0;text-decoration:underline}.calendar{background:#25272d;border-radius:11px;padding:12px}.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-top button{border:0;background:none;color:white;font-size:19px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal-grid .weekday{color:#abb0bd;font-size:11px;padding:8px 0}.day{border:0;background:none;color:white;height:36px;border-radius:7px}.day.future{opacity:.5}.day.marked{background:#326bc0}.day.today{outline:1px solid #a9c7f7;outline-offset:-2px}.day.active{background:#7c5ebd}.day.blank{visibility:hidden}.sumrow{height:51px;background:#25272d;border-radius:9px;display:flex;align-items:center;justify-content:space-between;margin:10px 0;padding:0 11px;font-size:11px}.sumrow button{background:none;border:0;color:white;font-size:18px}.modal{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px}.modalbox{background:#272a31;border:1px solid #4c505a;border-radius:16px;width:min(100%,365px);padding:17px 14px;color:white;max-height:90dvh;overflow:auto}.modaltitle{text-align:center;font-size:16px;font-weight:700;margin-bottom:10px}.wheel{height:220px;overflow:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative}.wheel:before,.wheel:after{content:'';display:block;height:88px}.wheel-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;color:#b4b7c2;font-size:18px}.wheel-item.active{color:white;font-weight:700;font-size:20px;background:#343944}.wheel-actions{margin-top:14px}.two-wheel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.addopt{display:block;width:100%;background:none;border:0;border-top:1px solid #454850;color:#90c0ff;height:42px;margin-top:4px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;border-radius:9px;background:#3a4050;padding:10px 15px;font-size:12px;max-width:90%;z-index:40}.nodata{color:#aeb2bc;text-align:center;background:#25272d;border-radius:9px;padding:18px;font-size:12px}.warn{color:#f3b6b6;font-size:12px;margin:8px 0}.hint{font-size:11px;color:#aeb2bc;margin-top:5px}.light .hint{color:#67849c}

.wheel{display:block;width:100%;height:220px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;touch-action:pan-y}

.wheel-item,.wheel button.wheel-item{display:flex!important;align-items:center;justify-content:center;box-sizing:border-box;position:relative;width:100%;min-width:0;height:44px;min-height:44px;margin:0;padding:0 8px;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:#b4b7c2!important;font-family:inherit;font-size:17px;line-height:1.2;text-align:center;-webkit-appearance:none;appearance:none;scroll-snap-align:center;white-space:nowrap}
.wheel-item.active,.wheel button.wheel-item.active{color:#fff!important;font-weight:700;font-size:20px;background:#343944!important;border-radius:8px!important}
.two-wheel .wheel-item{font-size:16px}
.pinwrap button svg{display:block;width:22px;height:22px;margin:auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

</style></head><body><main id="app" class="app"></main><script>
(()=>{'use strict';
const KEY='address-demo-v092';const TODAY=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});const today=TODAY();
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};let db=Object.assign({pin:'1234',stores:[],genres:[],durations:[45,60,70,90],stations:[],people:[],records:[]},load());
// Remove previously bundled genre presets once; keep user-created genres and existing records.
const GENRE_MIGRATION=KEY+'-genre-presets-cleared';
try {
  if(localStorage.getItem(GENRE_MIGRATION)!=='1'){
    const presets=new Set(['ホテヘル','デリヘル','メンエス','ソープ','ピンサロ']);
    db.genres=(Array.isArray(db.genres)?db.genres:[]).filter(g=>!presets.has(g));
    localStorage.setItem(KEY,JSON.stringify(db));
    localStorage.setItem(GENRE_MIGRATION,'1');
  }
} catch(e) { /* Storage may be restricted in preview contexts. */ }
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));let screen='lock',pin='',reveal=false,notice='',modal=null,form=null,origin='home',dateCursor=today.substring(0,7),selectedDate='',monthCursor=today.substring(0,7),showAll=false,revealSum=false,keyword='',draft={},applied={},expanded=false,detailId=null,settingsOld='',settingsNew='',settingsConfirm='';let filterContext='home';
const $=q=>document.querySelector(q);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const amount=n=>Number(n||0).toLocaleString('ja-JP');const yen=n=>amount(n)+'円';const digits=v=>String(v||'').replace(/\D/g,'').slice(0,4);const defaults=()=>({place:'',store:'',budget:'',genre:'',repeat:'',duration:''});draft=defaults();applied=defaults();
const ID=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);const store=id=>db.stores.find(s=>s.id===id);const person=id=>db.people.find(p=>p.id===id);const byname=(a,b)=>String(a).localeCompare(String(b),'ja');const total=r=>Number(r.play||0)+Number(r.hotel||0)+(r.ops||[]).reduce((s,o)=>s+Number(o.price||0),0);const durationLabel=v=>v?String(v)+'分':'未選択';const storeName=r=>store(r.storeId)?.name||'';const personName=r=>person(r.personId)?.name||'';const stationName=r=>r.station||'';const genreName=r=>r.genre||'';const emptyForm=type=>({type,date:today,storeId:'',personId:'',genre:'',duration:'',play:'',hotel:'',ops:[],station:'',breast:'',looks:'',repeat:'',review:''});const page=(inner,light=false)=>`<section class="page ${light?'light':''}">${inner}</section>`;const head=(name,back)=>`<div class="header"><button class="back" data-action="back" data-to="${back}">‹</button><span>${esc(name)}</span></div>`;const getRecord=id=>db.records.find(r=>r.id===id);
function go(next){screen=next;notice='';render();window.scrollTo(0,0)}
function render(){let html='';if(screen==='lock')html=renderLock();else if(screen==='fake')html=renderFake();else if(screen==='error')html=renderError();else if(screen==='settings')html=renderSettings();else if(screen==='reset-pin')html=renderReset();else if(screen==='home')html=renderHome();else if(screen==='results')html=renderResults();else if(screen==='form')html=renderForm();else if(screen==='history')html=renderHistory();else if(screen==='detail')html=renderDetail();else if(screen==='edit')html=renderForm(true);$('#app').innerHTML=html+(modal?renderModal():'')+(notice?`<div class="toast">${esc(notice)}</div>`:'');if(modal)requestAnimationFrame(initWheels);}

function initWheels(){
  document.querySelectorAll('.modal .wheel').forEach(w=>{
    const items=Array.from(w.querySelectorAll('.wheel-item'));
    if(!items.length)return;
    let ix=0;
    if(w.id==='month-wheel')ix=Math.max(0,items.findIndex(x=>x.dataset.month===modal?.month));
    else ix=Math.max(0,Math.min(items.length-1,Number(w.dataset.index)||0));
    w.scrollTop=ix*44;
    syncWheel(w,false);
  });
}
function syncWheel(w,update=true){
  if(!modal)return;
  const items=Array.from(w.querySelectorAll('.wheel-item'));
  if(!items.length)return;
  const ix=Math.max(0,Math.min(items.length-1,Math.round(w.scrollTop/44)));
  items.forEach((x,j)=>x.classList.toggle('active',j===ix));
  w.dataset.index=String(ix);
  if(!update)return;
  const item=items[ix];
  if(modal.type==='yearmonth'){
    if(w.id==='month-wheel')modal.month=item.dataset.month;
    else modal.year=item.textContent.trim();
  }else if(modal.type==='pick')modal.choice=item.textContent.trim();
}
$('#app').addEventListener('scroll',e=>{
  if(e.target.classList?.contains('wheel'))syncWheel(e.target);
},true);
function renderLock(){return page(`<div class="lock"><div class="locktop"><div class="logo">▣</div><div class="locktitle">住所管理アプリ(制作中)</div><div class="version">Ver. 0.9.2 β</div></div><div class="lightcard"><div class="field"><label>パスワード</label><div class="pinwrap"><input id="pin" type="${reveal?'text':'password'}" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" value="${esc(pin)}"><button data-action="eye" aria-label="表示切替">${reveal?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.1 3.9M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.7-1.3"/><path d="M10 10a3 3 0 0 0 4 4"/></svg>'}</button></div></div><div class="cols2"><button class="btn orange" data-action="fake">OK</button><button class="btn pale" data-action="clear-pin">リセット</button></div>${notice?`<div class="warn">${esc(notice)}</div>`:''}</div><button class="gear" data-action="gear" title="設定" aria-label="設定">⚙</button></div>`,true)}
function renderFake(){const a=[['住所を確認する','ADDR-503-01'],['住所を追加する','ADDR-503-02'],['住所を編集する','ADDR-503-03'],['住所を削除する','ADDR-503-04']];return page(head('住所管理','lock')+a.map(([t,c])=>`<button class="fake-item" data-action="fake-error" data-code="${c}">${t}<span>›</span></button>`).join(''),true)}
let currentError='ADDR-503-01';function renderError(){return page(`<div class="errorcenter"><div class="erricon">!</div><div class="errtitle">Error</div><div class="muted">ERROR CODE: ${esc(currentError)}</div><button class="btn orange" style="width:160px" data-action="back" data-to="fake">戻る</button></div>`,true)}
function renderSettings(){return page(head('設定','lock')+`<button class="fake-item" style="background:#d8f3e8;color:#256f55" data-action="reset-page">パスワードの再設定 <span>›</span></button>`,true)}
function renderReset(){return page(head('パスワードの再設定','settings')+`<div class="lightcard">${[['oldpin','現在のパスワード',settingsOld],['newpin','新しいパスワード',settingsNew],['confirmpin','新しいパスワード（確認）',settingsConfirm]].map(([id,label,value])=>`<div class="field"><label>${label}</label><input class="input" id="${id}" type="password" inputmode="numeric" maxlength="4" value="${esc(value)}" placeholder="••••"></div>`).join('')}<button class="btn orange full" data-action="save-pin">再設定する</button>${notice?`<div class="warn">${esc(notice)}</div>`:''}</div>`,true)}
const defs=[['place','場所'],['store','店'],['budget','予算'],['genre','ジャンル'],['repeat','リピ'],['duration','時間']];function filterOpts(k){if(k==='place')return ['すべて',...db.stations];if(k==='store')return ['すべて',...db.stores.map(x=>x.name)];if(k==='budget')return ['指定なし','～10,000円','～20,000円','～30,000円','30,000円以上'];if(k==='genre')return ['すべて',...db.genres];if(k==='repeat')return ['すべて','超あり','あり','なし'];return ['すべて',...db.durations.map(x=>x+'分')]};const filterChoices=()=>defs.map(([key,label])=>`<button class="qbtn ${draft[key]?'sel':''}" data-action="quick" data-key="${key}"><span class="qbtn-label">${esc(draft[key]||label)}</span><span class="qbtn-arrow" aria-hidden="true">▽</span></button>`).join('');function searchControls(){return `<div class="searchbar"><span>⌕</span><input id="keyword" placeholder="キーワードで検索" value="${esc(keyword)}"></div><div class="quicktitle">簡易検索</div><div class="cols3">${filterChoices()}</div><div class="cols2 qactions"><button class="btn" data-action="clear-search">リセット</button><button class="btn primary" data-action="run-search">検索する</button></div>`}
function renderHome(){return page(searchControls()+`<button class="navbutton" data-action="new"><i>⊕</i>新規</button><button class="navbutton" data-action="revisit"><i>↻</i>再来</button><button class="navbutton" data-action="history"><i>▦</i>履歴を見る</button><button class="navbutton" data-action="data-edit"><i>✎</i>データ編集</button>`)}
function filtered(){let q=keyword.trim().toLowerCase();return db.records.filter(r=>{let st=storeName(r),nm=personName(r);if(applied.place&&r.station!==applied.place)return false;if(applied.store&&st!==applied.store)return false;if(applied.genre&&r.genre!==applied.genre)return false;if(applied.repeat&&r.repeat!==applied.repeat)return false;if(applied.duration&&r.duration!==parseInt(applied.duration))return false;if(applied.budget){let n=total(r);if(applied.budget==='30,000円以上'?n<30000:n>Number(applied.budget.replace(/[^0-9]/g,'')))return false}return [r.date,st,nm,total(r),r.duration,r.genre,r.station,r.repeat,r.breast,r.looks,r.review,(r.ops||[]).map(o=>o.name).join(' ')].join(' ').toLowerCase().includes(q)}).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function chips(){let active=defs.filter(([key])=>applied[key]);return active.length?active.map(([k,label])=>`<span class="chip">${label}：${esc(applied[k])}<button data-action="remove-filter" data-key="${k}">×</button></span>`).join(''):'<span class="muted" style="font-size:11px">指定なし</span>'}
function recordRow(r){return `<div class="record"><div class="record-data"><span class="kind ${r.type==='再'?'repeat':''}">${r.type}</span><span>${esc(r.date.slice(5).replace('-','/'))}</span><span>${esc(storeName(r))}</span><span>${esc(personName(r))}</span><span>${yen(total(r))}</span><span>${durationLabel(r.duration)}</span></div><button class="ellipsis" data-action="detail" data-id="${r.id}" aria-label="詳細">•••</button></div>`}
function renderResults(){let arr=filtered();return page(head('検索結果','home')+searchControls()+`<div class="filter-summary"><span class="muted">検索条件</span><div class="chips">${chips()}</div></div><div class="result-head"><span><b>検索結果</b> <span class="muted">${arr.length}件</span></span><button class="ellipsis" data-action="expand" ${arr.length<=3?'disabled':''}>•••</button></div>${(expanded?arr:arr.slice(0,3)).map(recordRow).join('')||'<div class="nodata">該当する履歴はありません</div>'}`)}
const pinput=(label,key,kind='text')=>`<div class="field"><label>${label}</label><input class="input" data-field="${key}" type="${kind}" ${kind==='number'?'inputmode="numeric" min="0"':''} value="${esc(form[key]??'')}"></div>`;const fieldPicker=(label,key,display)=>`<div class="field"><label>${label}</label><button class="pick" data-action="pick" data-key="${key}">${esc(display||'選択してください')}</button></div>`;
function renderCosts(){return `<div class="field"><label>料金</label><div class="panel"><div class="moneygrid"><div><div class="hint">プレイ料金</div><input class="input" type="number" inputmode="numeric" min="0" data-field="play" placeholder="0" value="${esc(form.play)}"></div><div><div class="hint">ホテル代</div><input class="input" type="number" inputmode="numeric" min="0" data-field="hotel" placeholder="0" value="${esc(form.hotel)}"></div></div><div class="subhead">OP代</div><div id="oprows">${form.ops.map((op,i)=>`<div class="oprow"><input class="input" placeholder="OP内容" data-op="${i}" data-prop="name" value="${esc(op.name)}"><input class="input" type="number" inputmode="numeric" min="0" placeholder="OP代" data-op="${i}" data-prop="price" value="${esc(op.price)}"><button class="smallremove" data-action="remove-op" data-index="${i}">×</button></div>`).join('')}</div><button class="btn outline full" data-action="add-op">＋追加する</button><div class="amounttotal"><span>合計</span><span id="total">${yen(total(form))}</span></div></div></div>`}
function renderForm(edit=false){if(!form)form=emptyForm('新');let type=edit?'編集':(form.type==='新'?'新規':'再来');let isNew=form.type==='新'||edit;let st=store(form.storeId),pe=person(form.personId);let inner=head(type,edit?'detail':'home')+fieldPicker('日付','date',form.date.replaceAll('-','/'));
if(edit)inner+=fieldPicker('新規／再来','type',form.type==='新'?'新規':'再来');inner+=fieldPicker('店名','store',st?.name||'店を選択');if(isNew)inner+=fieldPicker('ジャンル','genre',form.genre);inner+=fieldPicker('名前','person',pe?.name||'名前を選択');if(isNew)inner+=fieldPicker('プレイ時間','duration',durationLabel(form.duration));inner+=renderCosts();if(isNew)inner+=fieldPicker('最寄り駅','station',form.station);if(isNew)inner+=pinput('乳','breast')+pinput('見た目','looks');inner+=fieldPicker('リピ','repeat',form.repeat)+`<div class="field"><label>レビュー（感想文）</label><textarea class="textarea" data-field="review">${esc(form.review)}</textarea></div><button class="btn primary full" data-action="save-record">保存する</button>`;return page(inner)}
function renderDetail(){let r=getRecord(detailId);if(!r)return page(head('詳細',origin));const row=(label,body,review=false)=>`<div class="detailrow ${review?'review':''}"><span>${label}</span><div class="value">${body}</div></div>`;const st=store(r.storeId);return page(head('詳細',origin)+`<div class="detailbox">${row('日付',`<span class="kind ${r.type==='再'?'repeat':''}">${r.type}</span> ${esc(r.date.replaceAll('-','/'))}`)}${row('店名',`<button class="linkbutton" data-action="store-link" data-id="${esc(st?.id||'')}">${esc(st?.name||'')} ↗</button>`)}${row('ジャンル',esc(r.genre))}${row('名前',esc(personName(r)))}${row('時間',durationLabel(r.duration))}${row('金額',yen(total(r)))}${row('最寄り駅',esc(r.station))}${row('リピ',esc(r.repeat))}${row('乳',esc(r.breast))}${row('見た目',esc(r.looks))}${row('感想',esc(r.review)||'—',true)}</div><div class="cols3" style="margin-top:16px"><button class="btn" data-action="edit">編集</button><button class="btn" style="color:#f1a8ab;border-color:#704449;background:#2b2325" data-action="delete">削除</button><button class="btn primary" data-action="detail-ok">OK</button></div>`)}
function daysInMonth(ym){let [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}function moveMonth(ym,d){let [y,m]=ym.split('-').map(Number);let t=new Date(y,m-1+d,1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`}
function calendarHtml(ym,selected,history=false){let [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=daysInMonth(ym),marked=new Set(db.records.map(r=>r.date));let h=`<div class="calendar"><div class="cal-top"><button data-action="calprev" ${ym<='2000-01'?'disabled':''}>‹</button><button data-action="yearmonth">${y}年 ${m}月 ⌄</button><button data-action="calnext" ${ym>=today.slice(0,7)?'disabled':''}>›</button></div><div class="cal-grid">${['日','月','火','水','木','金','土'].map(d=>`<div class="weekday">${d}</div>`).join('')}`;for(let i=0;i<first;i++)h+='<div class="day blank"></div>';for(let d=1;d<=days;d++){let date=ym+'-'+String(d).padStart(2,'0'),future=date>today,mark=marked.has(date),on=selected===date;h+=`<button class="day ${future?'future ':''}${history&&mark?'marked ':''}${date===today?'today ':''}${on?'active':''}" data-action="calday" data-date="${date}" ${future?'disabled':''}>${d}</button>`}return h+'</div></div>'}
function renderHistory(){let month=dateCursor,arr=db.records.filter(r=>r.date.startsWith(month)&&(!selectedDate||r.date===selectedDate)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let sum=db.records.filter(r=>r.date.startsWith(month)).reduce((n,r)=>n+total(r),0);return page(head('履歴を見る','home')+calendarHtml(month,selectedDate,true)+`<div class="sumrow"><span>合計金額　${revealSum?yen(sum):'●●●●●●円'}</span><button data-action="sum-eye">${revealSum?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.1 3.9M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.7-1.3"/><path d="M10 10a3 3 0 0 0 4 4"/></svg>'}</button></div><div class="result-head"><b>詳細</b><button class="ellipsis" data-action="history-expand" ${arr.length<=3?'disabled':''}>•••</button></div>${(showAll?arr:arr.slice(0,3)).map(recordRow).join('')||'<div class="nodata">この期間の履歴はありません</div>'}`)}
function wheelItems(options,selected){let i=Math.max(0,options.indexOf(selected));return `<div class="wheel" id="wheel" data-index="${i}">${options.map((v,j)=>`<button class="wheel-item ${i===j?'active':''}" data-action="wheel-item" data-index="${j}">${esc(v)}</button>`).join('')}</div>`}
function renderModal(){let m=modal;let inside='';if(m.type==='pick'){inside=`<div class="modaltitle">${esc(m.title)}</div>${wheelItems(m.options,m.choice)}${m.add?`<button class="addopt" data-action="add-choice">追加する</button>`:''}<div class="cols2 wheel-actions"><button class="btn" data-action="modal-close">キャンセル</button><button class="btn primary" data-action="picker-ok">決定</button></div>`}
else if(m.type==='date'){inside=`<div class="modaltitle">日付を選択</div>${calendarHtml(monthCursor,form.date)}<div class="cols2 wheel-actions"><button class="btn" data-action="modal-close">キャンセル</button><button class="btn primary" data-action="modal-close">決定</button></div>`}
else if(m.type==='yearmonth'){let years=Array.from({length:Number(today.slice(0,4))-1999},(_,i)=>String(2000+i)),months=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));inside=`<div class="modaltitle">年月を選択</div><div class="two-wheel"><div><div class="hint" style="text-align:center">年</div>${wheelItems(years,m.year)}</div><div><div class="hint" style="text-align:center">月</div><div class="wheel" id="month-wheel">${months.map(v=>`<button class="wheel-item ${m.month===v?'active':''}" data-action="month-item" data-month="${v}">${Number(v)}月</button>`).join('')}</div></div></div><div class="cols2 wheel-actions"><button class="btn" data-action="modal-close">キャンセル</button><button class="btn primary" data-action="ym-ok">決定</button></div>`}
else if(m.type==='add'){inside=`<div class="modaltitle">${esc(m.title)}</div>${m.kind==='store'?`<div class="field"><label>新しい店を追加</label><input id="addname" class="input" placeholder="店名"></div><div class="field"><label>リンクを追加（任意）</label><input id="addurl" class="input" type="url" placeholder="https://"></div><div class="field"><label>電話番号を追加（任意）</label><input id="addphone" class="input" type="tel"></div>`:m.kind==='person'?`<div class="hint">${esc(store(form.storeId)?.name||'店を選択してください')}</div><div class="field"><label>新しい名前を追加</label><input id="addname" class="input"></div>`:`<div class="field"><label>${esc(m.title)}</label><input id="addname" class="input" ${m.kind==='duration'?'inputmode="numeric" type="number" min="1"':''}></div>`}<div class="cols2"><button class="btn" data-action="modal-close">キャンセル</button><button class="btn primary" data-action="add-save">追加する</button></div>`}
else if(m.type==='confirm'){inside=`<div class="modaltitle">${esc(m.title)}</div><div style="text-align:center;color:#b9beca;margin:15px 0">${esc(m.body||'')}</div><div class="cols2"><button class="btn" data-action="modal-close">キャンセル</button><button class="btn primary" data-action="confirm-ok">${esc(m.ok||'OK')}</button></div>`}
return `<div class="modal" id="modal"><div class="modalbox">${inside}</div></div>`}
function picker(k){let choices=[],value='',add=false,title='';if(k==='date'){monthCursor=form.date.substring(0,7);modal={type:'date'};render();return}if(k==='type'){title='新規／再来を選択';choices=['新規','再来'];value=form.type==='新'?'新規':'再来'}else if(k==='store'){title='店を選択';choices=db.stores.map(s=>s.name);value=store(form.storeId)?.name||'';add=true}else if(k==='person'){title='名前を選択';choices=db.people.filter(p=>p.storeId===form.storeId).map(p=>p.name);value=person(form.personId)?.name||'';add=!!form.storeId}else if(k==='genre'){title='ジャンルを選択';choices=db.genres;value=form.genre;add=true}else if(k==='duration'){title='時間を選択';choices=db.durations.map(d=>d+'分');value=durationLabel(form.duration);add=true}else if(k==='station'){title='最寄り駅を選択';choices=db.stations;value=form.station;add=true}else if(k==='repeat'){title='リピを選択';choices=['超あり','あり','なし'];value=form.repeat}modal={type:'pick',key:k,title,options:choices,choice:value||choices[0]||'',add};render()}
function updateTotal(){let el=$('#total');if(el)el.textContent=yen(total(form))}function saveRecord(){if(!form.storeId){notice='店名を選択してください';render();return}if(!form.personId){notice='名前を選択してください';render();return}if(form.date>today||form.date<'2000-01-01'){notice='日付が範囲外です';render();return}if(form.type==='新'&&!form.genre){notice='ジャンルを選択してください';render();return}if(!form.repeat){notice='リピを選択してください';render();return}const r={...form,ops:form.ops.map(x=>({...x})),duration:Number(form.duration||0)};if(screen==='edit'){let i=db.records.findIndex(r=>r.id===detailId);if(i>=0)db.records[i]=r}else{r.id=ID();db.records.push(r)}persist();detailId=r.id;origin=screen==='edit'?'history':'home';form=null;go('detail')}
function back(to){if(to==='home'){go('home')}else if(to==='detail'){go('detail')}else if(to==='lock'){pin='';go('lock')}else{go(to)}}
function updateFilter(k,value){draft[k]=value==='すべて'||value==='指定なし'?'':value;render()}
$('#app').addEventListener('input',e=>{let t=e.target;if(t.id==='pin'){pin=digits(t.value);t.value=pin;return}if(t.id==='keyword'){keyword=t.value;return}if(['oldpin','newpin','confirmpin'].includes(t.id)){let v=digits(t.value);t.value=v;if(t.id==='oldpin')settingsOld=v;else if(t.id==='newpin')settingsNew=v;else settingsConfirm=v;return}if(t.dataset.field&&form){let k=t.dataset.field;form[k]=t.value;if(k==='play'||k==='hotel')updateTotal()}if(t.dataset.op!==undefined&&form){let op=form.ops[Number(t.dataset.op)];if(op){op[t.dataset.prop]=t.value;updateTotal()}}});
$('#app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action;if(!a)return;
if(a==='detail-ok'){go('home');return}if(a==='data-edit'){notice='データ編集画面は未設定です';render();return}if(a==='back'){back(b.dataset.to);return}if(a==='eye'){reveal=!reveal;render();return}if(a==='clear-pin'){pin='';notice='';render();return}if(a==='fake'){pin='';go('fake');return}if(a==='fake-error'){currentError=b.dataset.code;go('error');return}if(a==='gear'){if(!pin){go('settings')}else if(pin===db.pin){pin='';go('home')}else{notice='パスワードが違います';render()}return}if(a==='reset-page'){settingsOld=settingsNew=settingsConfirm='';go('reset-pin');return}if(a==='save-pin'){if(settingsOld!==db.pin){notice='現在のパスワードが違います';render();return}if(settingsNew.length!==4){notice='新しいパスワードは4桁で入力してください';render();return}if(settingsNew!==settingsConfirm){notice='確認用パスワードが一致しません';render();return}db.pin=settingsNew;persist();settingsOld=settingsNew=settingsConfirm='';go('settings');return}
if(a==='new'){form=emptyForm('新');go('form');return}if(a==='revisit'){form=emptyForm('再');go('form');return}if(a==='history'){dateCursor=today.slice(0,7);selectedDate='';showAll=false;revealSum=false;go('history');return}if(a==='quick'){let k=b.dataset.key;modal={type:'pick',key:k,title:defs.find(x=>x[0]===k)[1]+'を選択',options:filterOpts(k),choice:draft[k]||filterOpts(k)[0],add:false,quick:true};render();return}if(a==='run-search'){applied={...draft};expanded=false;go('results');return}if(a==='clear-search'){keyword='';draft=defaults();applied=defaults();expanded=false;render();return}if(a==='remove-filter'){draft[b.dataset.key]='';applied[b.dataset.key]='';expanded=false;render();return}if(a==='expand'){expanded=!expanded;render();return}if(a==='history-expand'){showAll=!showAll;render();return}if(a==='detail'){detailId=b.dataset.id;origin=screen;go('detail');return}if(a==='pick'){picker(b.dataset.key);return}if(a==='add-op'){form.ops.push({name:'',price:''});render();return}if(a==='remove-op'){form.ops.splice(Number(b.dataset.index),1);render();return}if(a==='save-record'){saveRecord();return}if(a==='edit'){let r=getRecord(detailId);form={...r,ops:(r.ops||[]).map(o=>({...o}))};go('edit');return}if(a==='delete'){modal={type:'confirm',title:'削除しますか？',body:'削除した履歴は元に戻せません。',ok:'削除する',job:'delete'};render();return}if(a==='store-link'){let st=store(b.dataset.id);modal={type:'confirm',title:'リンクへアクセスする',body:st?.url||'登録されたリンクはありません',ok:'アクセスする',job:'link',url:st?.url||''};render();return}
if(a==='calprev'||a==='calnext'){let d=a==='calprev'?-1:1;if(modal?.type==='date')monthCursor=moveMonth(monthCursor,d);else{dateCursor=moveMonth(dateCursor,d);selectedDate=''}render();return}if(a==='calday'){let day=b.dataset.date;if(modal?.type==='date'){form.date=day;monthCursor=day.slice(0,7);modal=null}else selectedDate=selectedDate===day?'':day;render();return}if(a==='yearmonth'){let ym=modal?.type==='date'?monthCursor:dateCursor;modal={type:'yearmonth',from:modal?.type==='date'?'date':'history',year:ym.slice(0,4),month:ym.slice(5,7)};render();return}if(a==='month-item'){const w=b.closest('.wheel');w.scrollTo({top:Number(b.dataset.month-1)*44,behavior:'smooth'});modal.month=b.dataset.month;return}if(a==='wheel-item'){let list=b.closest('.wheel');list.dataset.index=b.dataset.index;list.scrollTo({top:Number(b.dataset.index)*44,behavior:'smooth'});modal.choice=b.textContent.trim();list.querySelectorAll('.wheel-item').forEach(x=>x.classList.toggle('active',x===b));if(modal.type==='yearmonth')modal.year=b.textContent.trim();return}if(a==='ym-ok'){let ym=modal.year+'-'+modal.month;if(ym<'2000-01')ym='2000-01';if(ym>today.slice(0,7))ym=today.slice(0,7);if(modal.from==='date'){monthCursor=ym;modal={type:'date'}}else{dateCursor=ym;selectedDate='';modal=null}render();return}if(a==='modal-close'){modal=null;render();return}if(a==='picker-ok'){let m=modal;if(m.quick){updateFilter(m.key,m.choice);modal=null;render();return}let choice=m.choice;if(!choice){modal=null;render();return}if(m.key==='store'){let st=db.stores.find(x=>x.name===choice);form.storeId=st?.id||'';form.personId=''}else if(m.key==='person'){form.personId=db.people.find(p=>p.storeId===form.storeId&&p.name===choice)?.id||'';if(form.type==='再'&&screen!=='edit'){let prior=db.records.filter(r=>r.personId===form.personId).sort((a,b)=>b.date.localeCompare(a.date))[0];if(prior){['genre','duration','station','breast','looks'].forEach(k=>form[k]=prior[k])}}}else if(m.key==='duration')form.duration=parseInt(choice)||'';else if(m.key==='type')form.type=choice==='新規'?'新':'再';else form[m.key]=choice;modal=null;render();return}if(a==='add-choice'){let k=modal.key;if(k==='person'&&!form.storeId)return;modal={type:'add',kind:k,title:k==='store'?'新しい店を追加':k==='person'?'新しい名前を追加':k==='genre'?'新しいジャンルを追加':k==='duration'?'新しい時間を追加':'新しい最寄り駅を追加'};render();return}if(a==='add-save'){let m=modal;let name=($('#addname')?.value||'').trim();if(!name){notice='入力してください';render();return}if(m.kind==='store'){let s={id:ID(),name,url:($('#addurl')?.value||'').trim(),phone:($('#addphone')?.value||'').trim()};db.stores.push(s);form.storeId=s.id;form.personId=''}else if(m.kind==='person'){let p={id:ID(),storeId:form.storeId,name};db.people.push(p);form.personId=p.id}else if(m.kind==='genre'){if(!db.genres.includes(name))db.genres.push(name);form.genre=name}else if(m.kind==='station'){if(!db.stations.includes(name))db.stations.push(name);form.station=name}else if(m.kind==='duration'){let n=parseInt(name);if(!n||n<1){notice='正しい時間を入力してください';render();return}if(!db.durations.includes(n))db.durations.push(n);db.durations.sort((a,b)=>a-b);form.duration=n}persist();modal=null;notice='';render();return}if(a==='confirm-ok'){let m=modal;modal=null;if(m.job==='delete'){db.records=db.records.filter(r=>r.id!==detailId);persist();go(origin==='results'?'results':'history')}else if(m.job==='link'){if(/^https?:\/\//i.test(m.url)){window.open(m.url,'_blank','noopener,noreferrer')}else{notice='有効なリンクが登録されていません';render()}}return}if(a==='sum-eye'){revealSum=!revealSum;render();return}
});
render();
})();
</script></body></html>
